name: Build 64-bit Flutter APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Locate Flutter project & prepare Android files
        id: prep
        run: |
          set -e
          for z in *.zip; do
            if [ -f "$z" ]; then
              unzip -o "$z" -d extracted_project
            fi
          done

          PUBSPEC_FILE=$(find . -maxdepth 4 -name "pubspec.yaml" | head -n 1)
          if [ -z "$PUBSPEC_FILE" ]; then
            echo "pubspec.yaml not found!"
            exit 1
          fi

          FLUTTER_DIR=$(dirname "$PUBSPEC_FILE")
          echo "flutter_dir=$FLUTTER_DIR" >> "$GITHUB_OUTPUT"
          echo "Using Flutter project directory: $FLUTTER_DIR"

          if [ ! -f "$FLUTTER_DIR/android/gradlew" ]; then
            echo "gradlew missing, generating missing Android runner/wrapper files..."
            flutter create --platforms android --no-overwrite "$FLUTTER_DIR"
          fi

          mkdir -p "$HOME/.android"
          for KS in "$FLUTTER_DIR/android/debug.keystore" "$FLUTTER_DIR/android/app/debug.keystore" "$HOME/.android/debug.keystore"; do
            if [ ! -f "$KS" ]; then
              keytool -genkeypair \
                -v \
                -keystore "$KS" \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          done

      - name: Build single 64-bit (arm64-v8a) APK
        run: |
          set -e
          cd "${{ steps.prep.outputs.flutter_dir }}"
          flutter pub get
          flutter build apk --debug --target-platform android-arm64

      - name: Upload 64-bit APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: maxplayer-arm64-v8a-apk
          path: "**/build/app/outputs/flutter-apk/app-debug.apk"
          if-no-files-found: error
