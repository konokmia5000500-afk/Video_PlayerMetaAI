name: Build 64-bit Flutter APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare clean Flutter project
        id: prep
        run: |
          set -e
          for z in *.zip; do
            if [ -f "$z" ]; then
              unzip -o "$z" -d extracted_project
            fi
          done

          PUBSPEC_FILE=$(find . -maxdepth 4 -name "pubspec.yaml" | head -n 1)
          if [ -z "$PUBSPEC_FILE" ]; then
            echo "pubspec.yaml not found!"
            exit 1
          fi

          FLUTTER_DIR=$(dirname "$PUBSPEC_FILE")
          echo "flutter_dir=$FLUTTER_DIR" >> "$GITHUB_OUTPUT"

          # Remove duplicate suffixed files (*_1.*, *_2.*, *_1_1.*, etc.)
          find "$FLUTTER_DIR" -type f -regextype posix-extended \
            -regex '.*_(1|2|1_1|2_1)\.(dart|yaml|kts|xml|md|png)$' -delete

          # Backup existing AndroidManifest.xml and res if present
          TMP_ANDROID=$(mktemp -d)
          if [ -f "$FLUTTER_DIR/android/app/src/main/AndroidManifest.xml" ]; then
            cp "$FLUTTER_DIR/android/app/src/main/AndroidManifest.xml" "$TMP_ANDROID/AndroidManifest.xml"
          fi
          if [ -d "$FLUTTER_DIR/android/app/src/main/res" ]; then
            cp -r "$FLUTTER_DIR/android/app/src/main/res" "$TMP_ANDROID/res"
          fi

          # Recreate clean Android folder with proper AGP & Gradle plugin setup
          rm -rf "$FLUTTER_DIR/android"
          flutter create --platforms android "$FLUTTER_DIR"

          if [ -f "$TMP_ANDROID/AndroidManifest.xml" ]; then
            cp "$TMP_ANDROID/AndroidManifest.xml" "$FLUTTER_DIR/android/app/src/main/AndroidManifest.xml"
          fi
          if [ -d "$TMP_ANDROID/res" ]; then
            cp -r "$TMP_ANDROID/res/." "$FLUTTER_DIR/android/app/src/main/res/"
          fi
          rm -rf "$TMP_ANDROID"

          # Ensure single 64-bit ABI (arm64-v8a) in app/build.gradle.kts
          python3 - <<'EOF' "$FLUTTER_DIR/android/app/build.gradle.kts"
          import re, sys
          path = sys.argv[1]
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          if "abiFilters" not in content:
              content = re.sub(
                  r"(defaultConfig\s*\{)",
                  r'\1\n        ndk {\n            abiFilters += listOf("arm64-v8a")\n        }',
                  content,
                  count=1
              )
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          EOF

      - name: Build single 64-bit (arm64-v8a) APK
        run: |
          set -e
          cd "${{ steps.prep.outputs.flutter_dir }}"
          flutter pub get
          flutter build apk --debug --target-platform android-arm64

      - name: Upload 64-bit APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: maxplayer-arm64-v8a-apk
          path: "**/build/app/outputs/flutter-apk/app-debug.apk"
          if-no-files-found: error
