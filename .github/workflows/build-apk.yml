name: Build APK - Symphony Innova 10 (arm64)
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true
      - name: Unzip project if uploaded as ZIP
        run: |
          if [ -f "MaxPlayer-NO-YML.zip" ]; then unzip -o MaxPlayer-NO-YML.zip; fi
          if [ -f "MaxPlayer-NO-YML-FIXED.zip" ]; then unzip -o MaxPlayer-NO-YML-FIXED.zip; fi
          if [ -f "MaxPlayer.zip" ]; then unzip -o MaxPlayer.zip; fi
          ls -R | head -n 50
      - name: FIX v1 embedding - regenerate Android folder with v2
        run: |
          cd MaxPlayer || cd .
          rm -rf android
          flutter create --org com.maxplayer --project-name max_player_clone --platforms android .
          MAIN=$(find android/app/src/main -name "MainActivity.kt" | head -n 1)
          echo "MainActivity at: $MAIN"
          PKG=$(echo "$MAIN" | sed 's|android/app/src/main/kotlin/||; s|/MainActivity.kt||; s|/|.|g')
          printf 'package %s\nimport io.flutter.embedding.android.FlutterActivity\nclass MainActivity : FlutterActivity()\n' "$PKG" > "$MAIN"
          cat > android/app/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
            <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
            <uses-permission android:name="android.permission.WAKE_LOCK"/>
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
            <application android:label="Max Player" android:name="${applicationName}" android:icon="@mipmap/ic_launcher" android:supportsPictureInPicture="true">
              <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop" android:theme="@style/LaunchTheme" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|screenLayout|uiMode" android:supportsPictureInPicture="true" android:hardwareAccelerated="true" android:windowSoftInputMode="adjustResize">
                <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme"/>
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                <intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><data android:mimeType="video/*"/><data android:mimeType="audio/*"/></intent-filter>
              </activity>
              <meta-data android:name="flutterEmbedding" android:value="2"/>
            </application>
          </manifest>
          XML
          rm -f android/app/build.gradle.kts android/settings.gradle.kts android/build.gradle.kts
          cat > android/app/build.gradle <<'GRADLE'
          plugins { id "com.android.application"; id "kotlin-android"; id "dev.flutter.flutter-gradle-plugin" }
          android {
              namespace = "com.maxplayer.max_player_clone"
              compileSdk 36
              ndkVersion "25.1.8937393"
              defaultConfig {
                  applicationId "com.maxplayer.max_player_clone"
                  minSdk 21
                  targetSdk 36
                  versionCode 1
                  versionName "1.0"
                  ndk { abiFilters "arm64-v8a" }
              }
              buildTypes { release { signingConfig signingConfigs.debug } }
          }
          flutter { source "../.." }
          GRADLE
          grep -r flutterEmbedding android/app/src/main/AndroidManifest.xml
      - name: FIX Dart error + SDK 36
        run: |
          cd MaxPlayer || cd .
          echo "--- Fix PlayerConfiguration ready error ---"
          grep -rn "ready: true" lib/ || true
          sed -i "s/PlayerConfiguration(title: 'MaxPlayer', ready: true)/PlayerConfiguration(title: 'MaxPlayer')/g" lib/screens/player_screen.dart
          sed -i "s/ready: true/ready: () {}/g" lib/screens/player_screen.dart
          grep -n "PlayerConfiguration" lib/screens/player_screen.dart
          echo "--- Bump AGP for SDK 36 ---"
          sed -i 's/id "com.android.application" version "8.1.0"/id "com.android.application" version "8.6.1"/' android/settings.gradle || true
          sed -i 's/id "org.jetbrains.kotlin.android" version "1.9.0"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle || true
          cat android/settings.gradle
      - name: FIX corrupted SDK 36 + upgrade AGP for SDK 36
        run: |
          cd MaxPlayer || cd .
          echo "--- Upgrade Gradle wrapper for AGP 8.6.1 ---"
          sed -i 's/gradle-8.0-all.zip/gradle-8.7-all.zip/' android/gradle/wrapper/gradle-wrapper.properties || true
          sed -i 's/gradle-8.5-all.zip/gradle-8.7-all.zip/' android/gradle/wrapper/gradle-wrapper.properties || true
          cat android/gradle/wrapper/gradle-wrapper.properties
          echo "--- Reinstall corrupted android-36 platform ---"
          rm -rf $ANDROID_HOME/platforms/android-36
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" "build-tools;36.0.0" || yes | sdkmanager --install "platforms;android-36" "build-tools;36.0.0" || true
          ls -lh $ANDROID_HOME/platforms/android-36/android.jar
          echo "--- Force buildTools 36 ---"
          grep -q "buildToolsVersion" android/app/build.gradle || sed -i 's/ndkVersion "25.1.8937393"/buildToolsVersion "36.0.0"\n              ndkVersion "25.1.8937393"/' android/app/build.gradle
          cat android/app/build.gradle
      - name: Get packages
        run: |
          cd MaxPlayer || cd .
          flutter pub get
      - name: Build SINGLE APK - arm64 only
        run: |
          cd MaxPlayer || cd .
          flutter build apk --release --target-platform android-arm64
      - name: Rename to single clean name
        run: |
          mkdir -p output
          cp MaxPlayer/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk output/MaxPlayer-Inova10-arm64.apk || cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk output/MaxPlayer-Inova10-arm64.apk
          ls -lh output/
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MaxPlayer-Inova10-APK
          path: output/MaxPlayer-Inova10-arm64.apk
          if-no-files-found: error
