name: Build 64-bit Flutter APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare MaxPlayer project
        id: prep
        run: |
          set -e
          for z in *.zip; do
            if [ -f "$z" ]; then
              unzip -o "$z" -d extracted_project
            fi
          done

          PUBSPEC_FILE=$(find . -maxdepth 4 -name "pubspec.yaml" | head -n 1)
          if [ -z "$PUBSPEC_FILE" ]; then
            echo "pubspec.yaml not found!"
            exit 1
          fi

          FLUTTER_DIR=$(dirname "$PUBSPEC_FILE")
          echo "flutter_dir=$FLUTTER_DIR" >> "$GITHUB_OUTPUT"
          echo "Using Flutter project directory: $FLUTTER_DIR"

          # Remove duplicate suffixed files like *_1.dart, *_2.dart, *_1_1.yaml, etc.
          find "$FLUTTER_DIR" -type f -regextype posix-extended \
            -regex '.*_(1|2|1_1|2_1)\.(dart|yaml|kts|xml|md|png)$' -delete

          if [ ! -f "$FLUTTER_DIR/android/gradlew" ]; then
            flutter create --platforms android --no-overwrite "$FLUTTER_DIR"
          fi

          python3 - <<'EOF' "$FLUTTER_DIR/android"
          import glob, os, re

          android_dir = sys.argv[1] if "sys" in globals() else __import__("sys").argv[1]
          for path in glob.glob(os.path.join(android_dir, "**", "*.gradle.kts"), recursive=True):
              with open(path, "r", encoding="utf-8") as f:
                  text = f.read()
              text = re.sub(r"'([^'\\]*(?:\\.[^'\\]*)*)'", r'"\1"', text)
              text = text.replace("RepositoriesMode.PREFER_SETTINGS", "RepositoriesMode.PREFER_PROJECT")
              with open(path, "w", encoding="utf-8") as f:
                  f.write(text)
          EOF

          mkdir -p "$HOME/.android"
          for KS in "$FLUTTER_DIR/android/debug.keystore" "$FLUTTER_DIR/android/app/debug.keystore" "$HOME/.android/debug.keystore"; do
            if [ ! -f "$KS" ]; then
              keytool -genkeypair \
                -v \
                -keystore "$KS" \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          done

      - name: Build single 64-bit (arm64-v8a) APK
        run: |
          set -e
          cd "${{ steps.prep.outputs.flutter_dir }}"
          flutter pub get
          flutter build apk --debug --target-platform android-arm64

      - name: Upload 64-bit APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: maxplayer-arm64-v8a-apk
          path: "**/build/app/outputs/flutter-apk/app-debug.apk"
          if-no-files-found: error
